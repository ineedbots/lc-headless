# Installs the Linux build's packages, clones and bootstraps vcpkg, and restores its binary cache. Sets VCPKG_ROOT
# and VCPKG_DEFAULT_BINARY_CACHE for the later steps, so the presets' toolchainFile finds vcpkg.
name: Set up vcpkg
description: Install the build's packages and vcpkg, with vcpkg's binary cache restored.

inputs:
  cache-name:
    description: Names the binary cache, so builds for different triplets on one OS keep separate caches.
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential clang cmake ninja-build git curl zip unzip tar pkg-config perl

    # vcpkg is cloned whole, because vcpkg.json pins a baseline commit. The paths use forward slashes on Windows too,
    # since VCPKG_ROOT ends up in the preset's toolchainFile.
    - name: Clone vcpkg
      shell: bash
      run: |
        temp=$RUNNER_TEMP
        if [ "$RUNNER_OS" = Windows ]; then
          temp=$(cygpath -m "$temp")
        fi
        export VCPKG_ROOT="$temp/vcpkg" VCPKG_DEFAULT_BINARY_CACHE="$temp/vcpkg-cache"
        echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$VCPKG_DEFAULT_BINARY_CACHE" >> "$GITHUB_ENV"
        git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
        mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
        if [ "$RUNNER_OS" = Windows ]; then
          "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
        else
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
        fi

    # The binary cache holds both configurations' packages, so Debug and Release of one preset share it. vcpkg rebuilds
    # any package whose ABI hash changed, such as after a compiler update, so a stale restore is only slower.
    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ inputs.cache-name }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
        restore-keys: vcpkg-${{ inputs.cache-name }}-
