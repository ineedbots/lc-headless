# Builds and tests every preset pair: Windows (MSVC) and Linux (clang), in Debug and Release. Each pair is its own
# check. Release builds treat warnings as errors, so a new warning fails the Release checks only. The real-cache tests
# skip, because the runners have no game cache.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
        config: [debug, release]
        include:
          # windows-2022 is pinned because the windows-msvc preset uses the Visual Studio 17 2022 generator.
          - platform: windows
            runner: windows-2022
            configure-preset: windows-msvc
          - platform: linux
            runner: ubuntu-24.04
            configure-preset: linux-clang
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg

      - name: Configure
        run: cmake --preset ${{ matrix.configure-preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.platform }}-${{ matrix.config }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.platform }}-${{ matrix.config }} --parallel 4

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.platform }}-${{ matrix.config }}
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
            build/${{ matrix.configure-preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore
