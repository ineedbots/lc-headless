# Builds and tests every preset pair: Windows (MSVC, x64 and x86) and Linux (clang, x64 and arm64), in Debug and
# Release. Each pair is its own check. Release builds treat warnings as errors, so a new warning fails the Release
# checks only. A separate Linux Debug job collects native coverage. The real-cache tests skip, because the runners
# have no game cache.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  coverage:
    name: Native coverage (Linux x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-name: linux

      - name: Install LLVM coverage tools
        run: sudo apt-get install -y --no-install-recommends llvm libclang-rt-dev python3

      - name: Verify coverage collection
        run: python3 -B -m unittest discover -s tools/coverage

      - name: Build, test and report native coverage
        run: python3 tools/coverage/native.py

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f build/linux-coverage/coverage/summary.txt ]; then
            {
              echo '### Native coverage (Linux x64, Debug)'
              echo 'Real-cache tests skip without cache data. Hidden Slow tests are excluded.'
              echo 'Reports from failed test runs are partial; see the job status.'
              echo '```text'
              cat build/linux-coverage/coverage/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload native coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-linux-x64
          path: |
            build/linux-coverage/coverage/html/
            build/linux-coverage/coverage/coverage.lcov
            build/linux-coverage/coverage/coverage.profdata
            build/linux-coverage/coverage/summary.txt
            build/linux-coverage/coverage/summary.json
            build/linux-coverage/Testing/Temporary/
          if-no-files-found: warn

  build:
    name: ${{ matrix.platform }}-${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, windows-x86, linux, linux-arm64]
        config: [debug, release]
        include:
          # windows-2022 is pinned because the windows-msvc presets use the Visual Studio 17 2022 generator.
          - platform: windows
            runner: windows-2022
            configure-preset: windows-msvc
            preset: windows
          - platform: windows-x86
            runner: windows-2022
            configure-preset: windows-msvc-x86
            preset: windows-x86
          - platform: linux
            runner: ubuntu-24.04
            configure-preset: linux-clang
            preset: linux
          # The same presets as linux, built natively on an arm64 runner.
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            configure-preset: linux-clang
            preset: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-name: ${{ matrix.platform }}

      - name: Configure
        run: cmake --preset ${{ matrix.configure-preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.config }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-${{ matrix.config }} --parallel 4

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.platform }}-${{ matrix.config }}
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
            build/${{ matrix.configure-preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore
